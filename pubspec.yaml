name: pencet_print
description: "Simple POS app for thermal Bluetooth printer - Pencet Print"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  
  # Bluetooth thermal printer - more compatible
  print_bluetooth_thermal: ^1.1.1
  
  # ESC/POS command generator
  esc_pos_utils_plus: ^2.0.4
  
  # Image processing
  image: ^4.5.3
  
  # File handling
  file_picker: ^8.1.2
  
  # PDF rendering (to convert PDF to image)
  pdfx: ^2.8.0
  
  # State management
  provider: ^6.1.2
  
  # Local storage
  shared_preferences: ^2.3.3
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
