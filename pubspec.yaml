name: pencet_print
description: "Sekali Pencet, Langsung Print"
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  
  # Bluetooth thermal printer - more compatible
  print_bluetooth_thermal: ^1.1.1
  
  # ESC/POS command generator
  esc_pos_utils_plus: ^2.0.4
  
  # Image processing
  image: ^4.5.3
  
  # File handling
  file_picker: ^8.1.2
  
  # PDF rendering (to convert PDF to image)
  pdfx: ^2.8.0
  
  # State management
  provider: ^6.1.2
  
  # Local storage
  shared_preferences: ^2.3.3
  
  # Icons
  cupertino_icons: ^1.0.8
  receive_sharing_intent: ^1.8.1
  permission_handler: ^12.0.1
  firebase_core: ^4.3.0
  firebase_analytics: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#2D7FF9"
  adaptive_icon_foreground: "assets/app_icon.png"
